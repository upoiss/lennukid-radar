
<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <title>Lennukid lähedal – radar</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #07111d;
      color: #e5f4ff;
      font: 15px Arial, sans-serif;
    }
    header {
      padding: 14px;
      background: #0b1c2c;
      border-bottom: 1px solid #17405a;
    }
    h1 { margin: 0 0 6px; font-size: 21px; }
    #status { color: #9bb6ca; font-size: 13px; }
    .controls {
      display: flex;
      gap: 8px;
      padding: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #12334a;
      color: white;
      border: 1px solid #2a6586;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: #20516c; }
    #map {
      height: 65vh;
      min-height: 360px;
      background: #091522;
    }
    #details {
      padding: 12px 15px;
      line-height: 1.6;
      white-space: pre-line;
      color: #c9e4f7;
    }
    .plane {
      color: #66ffb2;
      font-size: 25px;
      text-align: center;
      text-shadow: 0 0 8px #00ff88;
    }
    footer {
      padding: 10px 15px;
      font-size: 12px;
      color: #7895aa;
    }
  </style>
</head>
<body>
  <header>
    <h1>✈ LENNUKID LÄHEDAL</h1>
    <div id="status">Valmis asukoha määramiseks</div>
  </header>

  <div class="controls">
    <button id="locate">📍 Minu asukoht</button>
    <button data-range="25">25 km</button>
    <button data-range="50">50 km</button>
    <button data-range="100">100 km</button>
    <button id="refresh">↻ Uuenda</button>
  </div>

  <div id="map"></div>
  <div id="details">Vajuta lennukile, et näha lennuandmeid.</div>
  <footer>
    Lennuandmed: ADS-B avalikud andmevood. Andmete saadavus sõltub
    andmeallikast ja selle päringupiirangutest.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (() => {
    const status = document.getElementById("status");
    const details = document.getElementById("details");

    let lat = 59.437;
    let lon = 24.753;
    let range = 50;
    let markers = [];
    let busy = false;
    let lastRequest = 0;
    let locationMarker = null;

    const map = L.map("map").setView([lat, lon], 8);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; CARTO',
        maxZoom: 19
      }
    ).addTo(map);

    function say(message) {
      status.textContent = message;
    }

    function clearPlanes() {
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];
    }

    function planeIcon(heading) {
      return L.divIcon({
        className: "",
        html: `<div class="plane" style="transform:rotate(${Number(heading)||0}deg)">✈</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    function showPlane(plane) {
      if (typeof plane.lat !== "number" ||
          typeof plane.lon !== "number") return;

      const marker = L.marker([plane.lat, plane.lon], {
        icon: planeIcon(plane.track)
      }).addTo(map);

      const call = plane.flight?.trim() || "Tundmatu lend";
      marker.bindTooltip(call);

      marker.on("click", () => {
        details.textContent =
          `✈ Lend: ${call}\n` +
          `ICAO: ${plane.hex || "—"}\n` +
          `Kõrgus: ${plane.alt_baro ?? "—"} ft\n` +
          `Kiirus: ${plane.gs ?? "—"} kt\n` +
          `Suund: ${plane.track ?? "—"}°\n` +
          `Vertikaalkiirus: ${plane.baro_rate ?? "—"} ft/min\n` +
          `Asukoht: ${plane.lat.toFixed(4)}, ${plane.lon.toFixed(4)}`;
      });

      markers.push(marker);
    }

    async function loadPlanes() {
      if (busy) return;

      // Ära tee päringuid sagedamini kui iga 30 sekundi järel.
      const wait = 30000 - (Date.now() - lastRequest);
      if (lastRequest && wait > 0) {
        say(`Järgmine päring ${Math.ceil(wait / 1000)} sek pärast`);
        return;
      }

      busy = true;
      lastRequest = Date.now();
      say("Laadin lennuandmeid…");

      try {
        // ADS-B dist-parameeter on meremiilides.
        const distNm = Math.round(range / 1.852);
        const url =
          `https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${distNm}`;

        const response = await fetch(url, {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error(`Andmeserveri HTTP viga ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data.aircraft)) {
          throw new Error("Andmeserver ei tagastanud lennukite loendit");
        }

        clearPlanes();
        data.aircraft.forEach(showPlane);

        say(`Lennukeid: ${markers.length} · Raadius ${range} km · uuendatud ${new Date().toLocaleTimeString("et-EE")}`);
      } catch (error) {
        say("Lennuandmete laadimine ebaõnnestus");
        details.textContent =
          "Viga: " + error.message + "\n\n" +
          "Kui näed teadet Failed to fetch või CORS, " +
          "ei luba brauser andmeserveriga otse ühendust. " +
          "Sel juhul vajab rakendus serveripoolset vahendajat. " +
          "Kui näed HTTP viga 429, on päringuid piiratud.";
      } finally {
        busy = false;
      }
    }

    document.getElementById("locate").addEventListener("click", () => {
      if (!navigator.geolocation) {
        say("See brauser ei toeta asukoha määramist.");
        return;
      }

      say("Küsin asukohta…");
      navigator.geolocation.getCurrentPosition(
        position => {
          lat = position.coords.latitude;
          lon = position.coords.longitude;
          map.setView([lat, lon], 9);

          if (locationMarker) map.removeLayer(locationMarker);
          locationMarker = L.circleMarker([lat, lon], {
            radius: 7,
            color: "#57c7ff",
            fillColor: "#57c7ff",
            fillOpacity: 1
          }).addTo(map).bindPopup("Sinu asukoht");

          lastRequest = 0;
          loadPlanes();
        },
        error => say("Asukohta ei saadud: " + error.message),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });

    document.querySelectorAll("[data-range]").forEach(button => {
      button.addEventListener("click", () => {
        range = Number(button.dataset.range);
        lastRequest = 0;
        loadPlanes();
      });
    });

    document.getElementById("refresh").addEventListener("click", () => {
      if (busy) return;
      lastRequest = 0;
      loadPlanes();
    });

    map.on("moveend", () => {
      // Kaardi liigutamine ei käivita automaatselt uut päringut.
    });

    loadPlanes();
    setInterval(loadPlanes, 30000);
  })();
  </script>
</body>
</html>
